apiVersion: v1
kind: Service
metadata:
  name: result-service
  annotations:
    description: "Exposes the result service to the outside world. Run `minikube service list` locally to see the URL of each service. On EKS the AWS cloud-provider controller provisions a real Network Load Balancer."
spec:
  type: LoadBalancer # initially it was NodePort but then to prevent having to do extra work for AWS I decided to switch to LoadBalancer
  selector:
    app: result
  ports:
    - port: 80
      targetPort: 80

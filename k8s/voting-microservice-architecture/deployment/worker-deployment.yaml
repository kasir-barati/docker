apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  labels:
    app: worker
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker/example-voting-app-worker
          ports:
            - containerPort: 80
              name: worker
  selector:
    matchLabels:
      app: worker

apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    app: db
  annotations:
    description: 'PostgreSQL instance used by voting app'
spec:
  containers:
    - name: db
      image: postgres:17.0-alpine3.20
      env:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
      ports:
        - containerPort: 5432
          name: postgres
